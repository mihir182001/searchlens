# .github/workflows/ci.yml -- Week 11: runs the full test suite, and
# separately confirms both Docker images still build, on every push/PR.
#
# The `test` job can run pytest with nothing but `pip install` -- no
# HF model weights, no trained classifier checkpoint, no dense index, no
# ANTHROPIC_API_KEY -- because every one of the 189 tests (as of Week 10)
# exercises real logic (routing, scoring, HTTP handling, UI rendering,
# citation parsing, the bootstrap significance test, ...) against injected
# fakes rather than the real models/API. This was verified by hand before
# writing this workflow: running the entire suite in a brand-new venv, with
# the data/ directory removed entirely, still gives 189 passed. That's the
# dependency-injection pattern used everywhere in this project (DenseIndex,
# QueryIntentClassifier, RAGGenerator, api_client, ...) paying off here --
# CI needs no secrets and no self-hosted GPU runner.
#
# The `docker-build` job only builds the images (it can't run them for
# real in CI either, for the same reason a sandbox couldn't while this was
# being built: no trained model/dense index/HF access there) -- but a
# build failure here still catches a broken Dockerfile or an unresolvable
# dependency before it reaches your own machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t searchlens-api:ci .

      - name: Build UI image
        run: docker build -f Dockerfile.ui -t searchlens-ui:ci .
